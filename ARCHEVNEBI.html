<!doctype html>
<html lang="ka">
<head>

<title>არჩევნები // ხმის მიცემის ჯიხური</title>
<style>
:root{--accent:#1b9869;--ink:#17211f;--light:#fafbf9}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;font-family:"Noto Sans Georgian","DejaVu Sans",Arial,sans-serif;background:#e4e9e5;color:var(--ink);user-select:none;-webkit-user-select:none}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.11;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.23' filter='url(%23n)'/%3E%3C/svg%3E");z-index:2}
#hud{position:absolute;inset:0;pointer-events:none;z-index:4}
#mast{position:absolute;left:28px;top:25px;display:flex;align-items:center;gap:12px}.logo-block{width:29px;height:29px;background:var(--accent);position:relative}.logo-block:after{content:"";position:absolute;left:10px;top:4px;width:9px;height:17px;border:3px solid white;border-top:0;transform:rotate(-13deg)}.logo{font-size:21px;letter-spacing:0;font-weight:950}.micro{font-size:9px;font-weight:800;letter-spacing:.7px;color:#545e5b}
#stateTag{position:absolute;right:30px;top:31px;font-size:10px;font-weight:950;letter-spacing:.3px;color:var(--accent);text-align:right;max-width:44vw}
#crosshair{position:absolute;left:50%;top:50%;width:15px;height:15px;transform:translate(-50%,-50%);transition:opacity .2s;opacity:.7}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:var(--accent)}#crosshair:before{width:15px;height:2px;top:7px}#crosshair:after{width:2px;height:15px;left:7px}
#crosshair{display:block;opacity:.24;pointer-events:none}
body.mouse-locked #crosshair{opacity:.94}
#lockHint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);color:#21392e;background:#ffffffd9;padding:9px 14px;font-weight:850;font-size:10px;letter-spacing:.2px;white-space:nowrap;transition:opacity .2s}
body.mouse-locked #lockHint{opacity:0}
#interact{position:absolute;left:50%;bottom:93px;transform:translateX(-50%);padding:12px 17px;background:#1c2523eb;color:white;font-size:11px;font-weight:850;letter-spacing:.1px;opacity:0;transition:opacity .16s;white-space:nowrap}
#interact.show{opacity:1}#interact kbd{font-family:inherit;border:1px solid #9fa8a2;font-size:11px;padding:4px 7px;margin-right:10px}
#footer{position:absolute;left:28px;bottom:24px;font-size:11px;letter-spacing:0;color:#63726c;font-weight:750}#footer b{color:var(--accent)}
#prompt{position:absolute;left:50%;bottom:29px;transform:translateX(-50%);font-size:11px;letter-spacing:.2px;font-weight:900;color:#ffffff;white-space:nowrap;opacity:0;transition:opacity .2s;text-shadow:0 1px 2px #111}
body.focus #prompt{opacity:1}body.focus #footer{opacity:0}
#eventTitle{position:absolute;top:7%;left:50%;transform:translate(-50%,-8px);text-align:center;pointer-events:none;opacity:0;transition:opacity .65s,transform .65s;width:95%}
#eventTitle.show{opacity:1;transform:translate(-50%,0)}#eventTitle h1{font-size:clamp(34px,5.6vw,78px);letter-spacing:-.04em;margin:0;line-height:.95;font-weight:1000;color:var(--accent);text-shadow:0 3px 0 rgba(255,255,255,.73)}
#eventTitle p{font-size:clamp(10px,1.5vw,14px);font-weight:950;letter-spacing:1px;margin:14px 0 0;color:#222b2b}
#rainCount{position:absolute;top:94px;right:29px;font-size:10px;letter-spacing:0;font-weight:850;text-align:right;opacity:0;transition:opacity .3s}#rainCount.show{opacity:1}#rainCount strong{font-size:32px;color:var(--accent);display:block;line-height:1.1}
#restart{position:absolute;right:29px;bottom:24px;pointer-events:auto;opacity:0;transform:translateY(9px);transition:opacity .3s,transform .3s;background:var(--accent);border:0;color:white;padding:11px 16px;font:900 11px "Noto Sans Georgian","DejaVu Sans",Arial,sans-serif;letter-spacing:0;cursor:pointer}#restart.show{opacity:1;transform:translateY(0)}
#penHeld{position:absolute;right:5%;bottom:-32px;transform:translateY(230px) rotate(-12deg);transition:transform .32s cubic-bezier(.18,.83,.17,1);width:110px;height:225px;pointer-events:none;opacity:.93}
#penHeld.visible{transform:translateY(12px) rotate(-12deg)}body.focus #penHeld{transform:translateY(210px) rotate(-12deg)}body.focus #dpad{opacity:.23;pointer-events:none}
#penHeld .barrel{position:absolute;top:0;left:45px;transform:rotate(22deg);height:215px;width:16px;background:linear-gradient(90deg,#083e2d,var(--accent) 45%,#12573f);border:2px solid #1b2523;clip-path:polygon(5% 0,95% 0,100% 90%,53% 100%,0 90%)}#penHeld .barrel:before{content:"";position:absolute;top:0;left:2px;width:8px;height:15px;background:#252a28}#penHeld .hand{position:absolute;top:126px;left:10px;width:88px;height:130px;transform:rotate(14deg);background:#d8d3c9;clip-path:polygon(22% 0,46% 0,63% 31%,78% 18%,97% 36%,100% 100%,0 100%,0 40%)}
#mobile{display:none;position:absolute;z-index:6;left:18px;right:18px;bottom:45px;justify-content:space-between;pointer-events:none}
#dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:5px}#dpad button,#mobileAction{pointer-events:auto;touch-action:none;border:1px solid #27322e;background:#e8efebe0;color:#18332a;font-size:21px;font-weight:950;min-width:46px;min-height:46px}#dpad button.held{background:var(--accent);color:white}#mobileAction{align-self:end;padding:0 18px;background:var(--accent);color:white;border:0;font-size:11px;letter-spacing:0}
@media(pointer:coarse),(max-width:640px){#mobile{display:flex}#footer{display:none}#mast{top:16px;left:16px}.logo{font-size:17px}#stateTag{right:16px;top:23px;font-size:9px}#rainCount{right:17px;top:165px}#lockHint{display:none}#restart{right:17px;bottom:18px}#interact{bottom:162px;font-size:10px}#prompt{bottom:146px;font-size:10px;letter-spacing:0;color:#17211f;text-shadow:none}#penHeld{right:-28px;transform-origin:bottom right}#penHeld.visible{transform:translateY(22px) rotate(-12deg) scale(.75)}#eventTitle{top:10%}#eventTitle h1{font-size:clamp(31px,7.7vw,55px)}}

<body>
<canvas id="game" aria-label="სამგანზომილებიანი თამაში: საარჩევნო ჯიხური"></canvas><div id="grain"></div>
<div id="hud">

 <div id="stateTag">ხმა არ მიგიციათ</div><div id="crosshair"></div><div id="lockHint">დააწკაპუნეთ მაუსის დასაფიქსირებლად</div>

 <div id="eventTitle"><h1 id="resultText">თქვენ მოიგეთ!</h1><p id="eventSubtitle">კარტოფილი ცვივა</p></div>

</div>
<div id="mobile"><div id="dpad"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><button id="mobileAction">მოქმედება</button></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),root=document.documentElement;
let W=0,H=0,F=750,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.65);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);F=Math.min(W*.94,H*1.22)}addEventListener('resize',resize);resize();
const palettes={green:[22,154,102],blue:[34,111,225],red:[223,55,62]};
let current=[...palettes.green],target=palettes.green;
const rgb=a=>'#'+a.map(n=>Math.round(n).toString(16).padStart(2,'0')).join('');
function mix(c1,c2,t){let a=parseColor(c1),b=parseColor(c2);return rgb(a.map((v,i)=>v+(b[i]-v)*t))}
function parseColor(c){if(c.startsWith('#')&&c.length===7)return [1,3,5].map(p=>parseInt(c.slice(p,p+2),16));return [244,244,241]}
const scheme=()=>({accent:rgb(current),accentDark:mix(rgb(current),'#101d20',.43),accentLight:mix(rgb(current),'#ffffff',.61),accentPale:mix(rgb(current),'#ffffff',.86)});
function pigment(c){let s=scheme();return s[c]||c}
const C={x:0,y:1.73,z:5.75,yaw:0,pitch:-.035},saved={...C};
let phase='approach',hasPen=false,vote=0,markStart=0,markProgress=0,seconds=0,prev=performance.now(),shake=0,fallCount=0,spawnClock=0,lookPointer=null;
const keys={},world=[],falling=[];
function poly(v,col,edge=null,layer=0){world.push({v,col,edge,layer})}
function box(x,y,z,w,h,d,c,layer=0){let a=x-w/2,b=x+w/2,e=y-h/2,f=y+h/2,g=z-d/2,k=z+d/2;
 const v=[[a,e,g],[b,e,g],[b,f,g],[a,f,g],[a,e,k],[b,e,k],[b,f,k],[a,f,k]];
 const faces=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
 const cols=Array.isArray(c)?c:[c,c,c,c,c,c];for(let i=0;i<6;i++)poly(faces[i].map(j=>v[j]),cols[i]||cols[0],null,layer)
}
function ground(x1,z1,x2,z2,c,y=.014){poly([[x1,y,z1],[x2,y,z1],[x2,y,z2],[x1,y,z2]],c)}
function build(){
 // An enclosed modern voting hall. The white/black/accent look is intentionally stylized.
 ground(-9.8,-13,9.8,9.2,'#e1e5e1',-.09);
 ground(-8.5,-12.6,8.5,8.3,'#f1f1ed',-.035);
 for(let x=-8;x<9;x+=2)ground(x-.012,-12.5,x+.012,8.3,'#dadfda',-.019);
 for(let z=-12;z<9;z+=2)ground(-8.5,z-.012,8.5,z+.012,'#dbe0db',-.018);
 // Two directional floor stripes lead into the single voting station.
 ground(-1.57,-5.05,-1.44,6.8,'accent',-.01);ground(1.44,-5.05,1.57,6.8,'accent',-.01);
 ground(-.1,4.45,.1,2.5,'accent',.005);
 poly([[-.53,.025,2.6],[.53,.025,2.6],[0,.025,1.63]],'accent');
 // Perimeter walls with recessed sections and large minimalist windows.
 box(-8.55,2.7,-2,.27,5.6,21.2,'#e9ebe7');box(8.55,2.7,-2,.27,5.6,21.2,'#e9ebe7');
 box(0,2.7,-12.57,17.5,5.6,.30,'#e1e5e2');box(0,2.7,8.48,17.5,5.6,.3,'#dedfda');
 box(-8.34,2.8,-1.5,.045,2.4,9.1,'#bfc9c4');box(8.34,2.8,-1.5,.045,2.4,9.1,'#bfc9c4');
 for(let s of [-1,1]){
   box(s*8.21,4.23,-1.55,.09,.095,9.5,'accent');box(s*8.21,1.49,-1.55,.09,.09,9.5,'#d1d7d3');
   for(let z=-5.9;z<=2.9;z+=2.9)box(s*8.22,2.8,z,.12,2.4,.06,'#ecefeb');
   // Offset structural ribs and low benches.
   for(let z of [-9.0,-.8,5.0])box(s*7.65,1.9,z,.5,3.8,.38,'#f8f9f6');
   box(s*6.45,.38,1.0,2.8,.72,1.05,['#dde2dd','#bbc7c1','#dfe5df','#cbd3cd','#ffffff','#d4dcd6']);
   box(s*6.45,.77,1,2.75,.10,1.1,'#1d2424');
 }
 // Ceiling panels; a long skylight slot is left open so the rain has somewhere to fall from.
 box(-6.3,5.56,-2.1,4.6,.20,21.5,'#f9faf7');box(6.3,5.56,-2.1,4.6,.20,21.5,'#f9faf7');
 box(0,5.56,-10.4,8.2,.2,4.2,'#f8f9f6');box(0,5.56,7.4,8.2,.2,2.35,'#f8f9f6');
 for(let s of [-1,1]){box(s*3.97,5.49,-1.3,.13,.13,15.0,'accent');box(s*6.1,5.39,0,.42,.12,9.0,'#ffffff')}
 // Back-lit election booth within the actual hall.
 box(0,.055,-8.0,6.3,.13,6.0,'#e5e8e2');
 box(-2.72,1.56,-7.87,.22,3.15,5.65,'#bfc9c4');box(2.72,1.56,-7.87,.22,3.15,5.65,'#bfc9c4');
 box(-2.72,1.67,-7.9,.16,2.85,5.3,'#f2f3ef');box(2.72,1.67,-7.9,.16,2.85,5.3,'#f2f3ef');
 box(0,1.6,-10.71,5.9,3.28,.25,'#d0d9d3');
 box(-2.72,2.75,-4.95,.31,5.25,.28,'accent');box(2.72,2.75,-4.95,.31,5.25,.28,'accent');
 box(0,3.28,-4.95,5.1,1.02,.22,'#202827'); // Sign background.
 box(0,3.85,-4.97,5.6,.11,.30,'accent');
 box(0,4.22,-7.8,5.7,.12,5.85,'#f8f9f5');
 // A genuinely low, short writing table. The ballot lies flat on its surface.
 for(let x of [-1.44,1.44])for(let z of [-8.13,-7.04])box(x,.475,z,.105,.95,.105,'#333d37');
 box(0,.965,-7.57,3.24,.12,1.63,['#343e39','#202b25','#29342e','#222d27','#404a43','#202823']);
 box(0,1.030,-7.57,3.15,.012,1.54,'#c9d2cb');
 // Ballot's dark backing is barely higher than the tabletop, not a display stand.
 poly([[-1.105,1.044,-8.22],[1.105,1.044,-8.22],[1.105,1.044,-6.85],[-1.105,1.044,-6.85]],'#637369');
 // The pen is rendered as a separate foreground 3D prop, removable on pickup.
 // A few civic-hall touches, all deliberately text-free.
 box(-5.9,1.2,-7.5,.18,2.42,.18,'#2e3934');box(-5.9,2.44,-7.5,1.35,.12,.26,'accent');
 box(5.9,1.2,-7.5,.18,2.42,.18,'#2e3934');box(5.9,2.44,-7.5,1.35,.12,.26,'accent');
 for(let s of [-1,1]){box(s*5.3,.14,5.1,1.1,.28,1.1,'#252e29');box(s*5.3,.69,5.1,.64,.95,.64,'accentDark')}
}build();
// Corners in paper texture order: top-left, top-right, bottom-right, bottom-left.
const paperQuad=[[-1.072,1.050,-8.185],[1.072,1.050,-8.185],[1.072,1.050,-6.888],[-1.072,1.050,-6.888]];
const signQuad=[[-2.20,3.56,-4.805],[2.20,3.56,-4.805],[2.20,2.99,-4.805],[-2.20,2.99,-4.805]];
const paperTex=document.createElement('canvas');paperTex.width=900;paperTex.height=630;
const signTex=document.createElement('canvas');signTex.width=1024;signTex.height=180;
const st=signTex.getContext('2d'),pt=paperTex.getContext('2d');
function drawSign(){st.clearRect(0,0,1024,180);st.fillStyle='#1a2420';st.fillRect(0,0,1024,180);st.fillStyle='#f7faf6';st.textAlign='center';st.textBaseline='middle';st.font='900 111px "Noto Sans Georgian","DejaVu Sans",sans-serif';st.fillText('არჩევნები',512,92,925)}drawSign();
function makePaper(){
 pt.clearRect(0,0,900,630);pt.fillStyle='#fffef8';pt.fillRect(0,0,900,630);
 pt.strokeStyle='#cbd1c7';pt.lineWidth=7;pt.strokeRect(16,16,868,598);
 pt.fillStyle='#24372b';pt.fillRect(39,40,822,7);
 pt.font='900 43px "Noto Sans Georgian","DejaVu Sans",sans-serif';pt.textAlign='left';pt.fillText('არჩევნები',52,108);
 pt.fillStyle='#55675b';pt.font='800 22px "Noto Sans Georgian","DejaVu Sans",sans-serif';pt.fillText('საარჩევნო ბიულეტენი / შემოხაზეთ ერთი',52,151,788);
 pt.strokeStyle='#d3d9d2';pt.lineWidth=4;pt.beginPath();pt.moveTo(48,174);pt.lineTo(852,174);pt.stroke();
 // Large clickable numbers visible on the paper itself from a standing view.
 pt.fillStyle='#f4f5ed';pt.fillRect(48,199,384,343);pt.fillRect(467,199,385,343);
 pt.strokeStyle='#aebbb0';pt.lineWidth=4;pt.strokeRect(48,199,384,343);pt.strokeRect(467,199,385,343);
 pt.fillStyle='#152820';pt.textAlign='center';pt.font='900 224px "Noto Sans Georgian","DejaVu Sans",sans-serif';pt.fillText('41',240,442);pt.fillText('5',660,442);
 pt.textAlign='left';pt.fillStyle='#7a887d';pt.font='800 19px "Noto Sans Georgian","DejaVu Sans",sans-serif';pt.fillText('მონიშნეთ მხოლოდ ერთი ნომერი',52,587,772);
 if(vote&&markProgress>0){const cx=vote===41?240:660,cy=369;
  pt.strokeStyle='#168c55';pt.lineWidth=16;pt.lineCap='round';pt.lineJoin='round';pt.beginPath();let steps=Math.max(1,Math.ceil(markProgress*90));
  for(let i=0;i<=steps;i++){let a=-.29+2*Math.PI*i/90,x=cx+160*Math.cos(a),y=cy+150*Math.sin(a);if(i===0)pt.moveTo(x,y);else pt.lineTo(x,y)}pt.stroke()}
}

function cam(p){let dx=p[0]-C.x,dy=p[1]-C.y,dz=p[2]-C.z,cy=Math.cos(C.yaw),sy=Math.sin(C.yaw),cp=Math.cos(C.pitch),sp=Math.sin(C.pitch),forward=dx*sy-dz*cy;return {x:dx*cy+dz*sy,y:dy*cp-forward*sp,z:forward*cp+dy*sp}}
function clip(v){let a=[];for(let i=0;i<v.length;i++){let p=v[i],q=v[(i+1)%v.length],pin=p.z>.09,qin=q.z>.09;if(pin)a.push(p);if(pin!==qin){let t=(.09-p.z)/(q.z-p.z);a.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t,z:.09})}}return a}
function project(p){return {x:W/2+p.x*F/p.z,y:H/2-p.y*F/p.z,z:p.z}}
function quadProjected(q){return q.map(x=>cam(x)).map(p=>p.z>.10?project(p):null)}
function polygon(v,c,list,layer=0){let cp=clip(v.map(cam));if(cp.length<3)return;let depth=cp.reduce((s,v)=>s+v.z,0)/cp.length;if(depth>70)return;let pp=cp.map(project);if(pp.every(p=>p.x<-30)||pp.every(p=>p.x>W+30)||pp.every(p=>p.y<-30)||pp.every(p=>p.y>H+30))return;list.push({type:'face',p:pp,c,depth,layer})}
function texturedQuad(q,texture,list,layer=1,subdiv=1){
 if(subdiv===1){const cc=q.map(cam);if(cc.some(p=>p.z<=.12))return;let dst=cc.map(project),depth=cc.reduce((s,p)=>s+p.z,0)/4;list.push({type:'texture',p:dst,tex:texture,depth:depth-.022,layer});return}
 const n=subdiv,m=Math.max(4,Math.round(subdiv*.7));
 const lerp=(a,b,f)=>a+(b-a)*f;
 const point=(u,v)=>[0,1,2].map(i=>lerp(lerp(q[0][i],q[1][i],u),lerp(q[3][i],q[2][i],u),v));
 for(let j=0;j<m;j++)for(let i=0;i<n;i++){
  let u0=i/n,u1=(i+1)/n,v0=j/m,v1=(j+1)/m;
  let corners=[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)].map(cam);
  if(corners.some(p=>p.z<=.12))continue;
  let p=corners.map(project);
  let triangles=[[0,1,2],[0,2,3]],texcoords=[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
  for(let ids of triangles)list.push({type:'texturetri',p:ids.map(k=>p[k]),uv:ids.map(k=>texcoords[k]),tex:texture,
      depth:-100+ids.reduce((a,k)=>a+corners[k].z,0)/3000,layer})
 }
}
function textureTriangle(src,coords,uv){

document.addEventListener('mousemove',e=>{
 if(!isLocked())return;
 C.yaw+=e.movementX*.0027;
 C.pitch=Math.max(-1.3,Math.min(1.3,C.pitch-e.movementY*.0025));
});
canvas.addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse'||!lookPointer||lookPointer.id!==e.pointerId)return;
 const dx=e.clientX-lookPointer.x,dy=e.clientY-lookPointer.y;
 if(Math.abs(e.clientX-lookPointer.startX)+Math.abs(e.clientY-lookPointer.startY)>9)lookPointer.dragged=true;
 if(lookPointer.dragged){C.yaw+=dx*.0047;C.pitch=Math.max(-1.3,Math.min(1.3,C.pitch-dy*.0041))}
 lookPointer.x=e.clientX;lookPointer.y=e.clientY
});
canvas.addEventListener('pointerup',e=>{
 if(lookPointer&&lookPointer.id===e.pointerId){
  if(!lookPointer.dragged)interactAt(e.clientX,e.clientY);
  lookPointer=null
 }
});
addEventListener('pointerup',e=>{if(lookPointer&&lookPointer.id===e.pointerId)lookPointer=null});
canvas.addEventListener('pointercancel',()=>lookPointer=null);

for(let b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('held')});let off=()=>{keys[k]=false;b.classList.remove('held')};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
$('mobileAction').addEventListener('click',()=>{if(vote){reset();return}takeAction(true)});$('restart').addEventListener('click',reset);
